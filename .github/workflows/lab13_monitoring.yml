
name: Lab 13 - End-to-End MLOps

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Run MLOps monitoring trigger
        shell: powershell
        run: |
          $Documents = [Environment]::GetFolderPath("MyDocuments")
          $ProjectRoot = Join-Path $Documents "241FA18030\churn_pridiction"

          Set-Location $ProjectRoot

          $Python = Join-Path $ProjectRoot ".venv\Scripts\python.exe"
          $Script = Join-Path $ProjectRoot "src\12_monitor_trigger.py"

          if (!(Test-Path $Python)) {
              throw "Python virtual environment not found."
          }

          if (!(Test-Path $Script)) {
              throw "Monitoring script not found."
          }

          & $Python $Script

          if ($LASTEXITCODE -ne 0) {
              throw "Monitoring workflow failed."
          }

      - name: Show monitoring report
        shell: powershell
        run: |
          $Documents = [Environment]::GetFolderPath("MyDocuments")
          $ProjectRoot = Join-Path $Documents "241FA18030\churn_pridiction"
          $Report = Join-Path $ProjectRoot "outputs\monitoring\monitor_trigger_report.json"

          if (!(Test-Path $Report)) {
              throw "Monitoring report not found."
          }

          Get-Content $Report

      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl get deployment churn-prediction-deployment
          kubectl get pods
          kubectl get services
