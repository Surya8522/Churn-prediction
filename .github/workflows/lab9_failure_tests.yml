name: Lab 9 - Churn Prediction Failure Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - "data/raw/churn.csv"
      - ".github/workflows/lab9_failure_tests.yml"

jobs:
  failure-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify configuration
        run: |
          python -c "import yaml; c=yaml.safe_load(open('config.yaml', encoding='utf-8')); print('Config loaded:', c['project']['name'])"

      - name: Validate raw dataset
        run: python src/validate_data.py

      - name: Preprocess dataset
        run: python src/preprocess_pipeline.py

      - name: Validate processed data
        run: python src/validate_outputs.py

      - name: Train model and log experiment
        run: python src/train_mlflow.py

      - name: Evaluate model
        run: python src/evaluate_model.py

      - name: Run quality gate
        run: python src/quality_gate.py

      - name: Run failure-injection checks
        run: python src/failure_injection.py

      - name: Upload failure-test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab9-failure-test-reports
          if-no-files-found: warn
          path: |
            reports/
            artifacts/
            outputs/
            logs/
